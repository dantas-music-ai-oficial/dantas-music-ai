<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ezequias Dantas - 16 Mil Musicas</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.topo{text-align:center;padding:15px;background:#111;border-bottom:4px solid #ffcc00}
.card{background:#151515;padding:15px;border-radius:12px;margin:12px;border-left:5px solid #ffcc00}
.btn{background:#ffcc00;color:#000;padding:14px;border-radius:30px;font-weight:900;border:none;width:100%;margin-top:8px}
.btn2{background:#25D366;color:#fff;padding:14px;border-radius:30px;font-weight:900;border:none;width:100%;margin-top:8px}
input,select{width:100%;padding:13px;border-radius:10px;background:#222;color:#fff;border:1px solid #444;margin:7px 0;box-sizing:border-box}
.tabs{display:flex;gap:8px;padding:10px;overflow:auto}
.tab{padding:10px 18px;border-radius:30px;border:2px solid #ffcc00;background:#000;color:#ffcc00;font-weight:900}
.tab.ativo{background:#ffcc00;color:#000}
audio,video,iframe{width:100%;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<div class="topo">
<h1 style="color:#ffcc00;margin:0">EZEQUIAS DANTAS</h1>
<p>16 MIL MÚSICAS - (85) 98733-4142 - FORTALEZA CE</p>
</div>
<div style="max-width:700px;margin:auto">
<div class="card" style="border:2px solid #25D366">
<h3 style="color:#25D366;margin:0">📱 LUGAR 1 - DIRETO DO ZAP</h3>
<input id="n1" placeholder="Nome da música">
<input type="file" id="f1" accept="audio/*,video/*" style="background:#25D366;color:#000;font-weight:900">
<button class="btn2" onclick="addD()">COLOCAR DIRETO</button>
</div>
<div class="card" style="border:2px solid #ffcc00">
<h3 style="color:#ffcc00;margin:0">🔗 LUGAR 2 - COM LINK</h3>
<input id="n2" placeholder="Nome da música">
<select id="t2"><option value="mp3">🎵 MP3</option><option value="mp4">🎬 MP4</option></select>
<input id="l2" placeholder="Link do Drive ou YouTube">
<button class="btn" onclick="addL()">COLOCAR COM LINK</button>
</div>
<div class="tabs"><button class="tab ativo" id="bt" onclick="fil='todos';ver()">TODOS</button><button class="tab" id="b3" onclick="fil='mp3';ver()">MP3</button><button class="tab" id="b4" onclick="fil='mp4';ver()">MP4</button></div>
<div id="lista"></div>
</div>
<script>
let ms=JSON.parse(localStorage.getItem('FINAL')||'[]');let fil='todos';
function ver(){
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('ativo'));
document.getElementById(fil=='todos'?'bt':fil=='mp3'?'b3':'b4').classList.add('ativo');
let l=document.getElementById('lista');l.innerHTML='';
let li=fil=='todos'?ms:ms.filter(x=>x.tipo==fil);
li.forEach(m=>{
let i=ms.indexOf(m);
let pl=m.origem=='direto'?(m.tipo=='mp4'?`<video controls src="${m.src}"></video>`:`<audio controls src="${m.src}"></audio>`):`<audio controls src="${m.src}"></audio><br><a href="${m.src}" target="_blank" style="color:#ffcc00">Abrir link</a>`;
l.innerHTML+=`<div class=card><b style=color:#ffcc00>${m.nome}</b> [${m.tipo}]<br>${pl}<br><a href="#" onclick="ms.splice(${i},1);localStorage.setItem('FINAL',JSON.stringify(ms));ver()" style="color:red">Apagar</a></div>`;
});
}
function addD(){
let n=document.getElementById('n1').value||'Música';
let f=document.getElementById('f1').files[0];
if(!f){alert('Escolhe o arquivo!');return}
let r=new FileReader();r.onload=e=>{ms.unshift({nome:n,src:e.target.result,tipo:f.type.includes('video')?'mp4':'mp3',origem:'direto'});localStorage.setItem('FINAL',JSON.stringify(ms));ver();alert('Colocado!')};r.readAsDataURL(f);
}
function addL(){
let n=document.getElementById('n2').value;let lk=document.getElementById('l2').value;let t=document.getElementById('t2').value;
if(!n||!lk){alert('Nome e link!');return}
ms.unshift({nome:n,src:lk,tipo:t,origem:'link'});localStorage.setItem('FINAL',JSON.stringify(ms));ver();
}
ver();
</script>
</body>
</html>
